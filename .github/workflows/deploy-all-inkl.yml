# Testet FriendSplit und lädt es per FTPS auf den All-Inkl-Webspace (friendssplitt.stuttgartapps.de).
#
# Einmalig im KAS anlegen (wie bei der Reiseapp):
#   1. Subdomain friendssplitt.stuttgartapps.de mit SSL
#   2. FTP-Benutzer, beschränkt auf den Ordner der Subdomain
#   3. MariaDB-Datenbank (Name = Benutzer, z. B. d0xxxxxx)
#
# Dann in GitHub → Settings → Secrets and variables → Actions:
#   KEY_FRIENDSPLIT  Passwort des FTP-Benutzers (alternativ KEY_FRIENSSPLIT oder FTP_PASSWORD)
#   (FTP-Benutzer f018eadd steht unten unter env – auf /friendssplitt.stuttgartapps.de/ beschränkt, daher Zielordner ./)
#   (Datenbank d0488808 steht unten unter env – per Secret DB_NAME überschreibbar)
#   DB_PASSWORD      optional: Datenbank-Passwort (sonst gilt KEY_FRIENDSPLIT – wenn du dasselbe Passwort vergibst)
#   SETUP_CODE       optional: Code zum Anlegen des ersten Kontos, mind. 12 Zeichen (sonst gilt das Datenbank-Passwort)
# Server und Zielordner stehen unten unter env (keine Geheimnisse; per Secret FTP_SERVER, FTP_DIR überschreibbar).
# Alle Werte dürfen statt unter „Secrets“ auch unter „Variables“ stehen (Passwörter bitte als Secret).
#
# api/config.php entsteht beim Upload aus diesen Secrets – sie liegt nie im Repository.
# Läuft bei jedem Push auf den Haupt-Branch und lässt sich unter „Actions“ auch von Hand starten.
name: Deploy zu ALL-INKL

on:
  push:
    branches: [claude/friendsplit-mvp, main]
  workflow_dispatch:

concurrency:
  group: deploy-all-inkl
  cancel-in-progress: false

env:
  APP_URL: ${{ vars.APP_URL || 'https://friendssplitt.stuttgartapps.de/' }}
  FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER || 'w0222c40.kasserver.com' }}
  FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME || 'f018eadd' }}
  FTP_DIR: ${{ secrets.FTP_DIR || vars.FTP_DIR || './' }}
  MAIL_FROM: noreply@stuttgartapps.de
  DB_NAME: ${{ secrets.DB_NAME || vars.DB_NAME || 'd0488808' }}

jobs:
  deploy:
    # Nur vom Standard-Branch hochladen (Pushes auf andere Branches testen nur)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Version
        run: php -v && php -m | grep -i -E 'pdo_sqlite|mbstring'

      - name: Rechenlogik testen
        run: php tests/SplitTest.php

      - name: API testen
        run: php tests/ApiTest.php

      - name: Zugangsdaten vorhanden?
        id: creds
        if: github.ref_name == github.event.repository.default_branch
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.KEY_FRIENDSPLIT || secrets.KEY_FRIENSSPLIT }}
        run: |
          missing=""
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing KEY_FRIENDSPLIT"
          [ -n "$DB_NAME" ] || missing="$missing DB_NAME"
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Zugangsdaten gefunden: $FTP_USERNAME@$FTP_SERVER, Zielordner $FTP_DIR, Datenbank $DB_NAME"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Es fehlen die Repository-Secrets:$missing – Tests sind grün, Upload übersprungen."
          fi

      - name: Server-Konfiguration schreiben
        if: steps.creds.outputs.ok == 'true'
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.KEY_FRIENDSPLIT || secrets.KEY_FRIENSSPLIT || secrets.FTP_PASSWORD }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          # Werte über var_export als sichere PHP-Zeichenketten einsetzen
          php -r '
            $config = [
              "db" => [
                "dsn" => "mysql:host=localhost;dbname=" . getenv("DB_NAME") . ";charset=utf8mb4",
                "user" => getenv("DB_NAME"),
                "password" => getenv("DB_PASSWORD"),
              ],
              "app_url" => getenv("APP_URL"),
              "mail" => ["transport" => "mail", "from" => getenv("MAIL_FROM"), "from_name" => "FriendSplit"],
              "setup_code" => getenv("SETUP_CODE"),
              "setup_key" => "",
              "auto_migrate" => true,
            ];
            echo "<?php\n// Automatisch beim Upload erzeugt (GitHub Actions). Nicht von Hand ändern.\nreturn " . var_export($config, true) . ";\n";
          ' > public/api/config.php
          php -l public/api/config.php
          echo "config.php geschrieben (Datenbank $DB_NAME, $APP_URL)"

      - name: Per FTPS hochladen
        if: steps.creds.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.KEY_FRIENDSPLIT || secrets.KEY_FRIENSSPLIT }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ env.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            data/*.sqlite*
            data/mail.log

      - name: Seite erreichbar?
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          echo "$APP_URL antwortet mit HTTP $code"
          echo "API: $(curl -s "${APP_URL}api/index.php?action=status")"
          test "$code" = "200"
